<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corta: estadísticas</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main class="contenedor">
    <header class="marca">
      <img src="logo.png" alt="" class="logo">
      <span>Corta</span>
    </header>

    <section class="tarjeta">
      <div class="encabezado">
        <span class="eyebrow">Tus enlaces</span>
        <h1>Estadísticas de tus links</h1>
        <p class="sub">Ingresá el código corto para conocer su actividad.</p>
      </div>

      <form id="form-stats">
        <label class="sr-only" for="codigo">Código del enlace</label>
        <input type="text" id="codigo" placeholder="Ejemplo: a3k" autocomplete="off" required>
        <button type="submit">Consultar</button>
      </form>

      <div class="stats" aria-live="polite">
        <article class="stat stat-destacada">
          <span class="etiqueta">Clicks totales</span>
          <span class="numero">—</span>
        </article>
        <article class="stat">
          <span class="etiqueta">URL original</span>
          <span class="dato">—</span>
        </article>
        <article class="stat">
          <span class="etiqueta">Creado el</span>
          <span class="dato">—</span>
        </article>
      </div>
    </section>

    <footer class="pie">
      <a href="index.html"><span aria-hidden="true">←</span> Crear un nuevo link</a>
    </footer>
  </main>
</body>
</html>
