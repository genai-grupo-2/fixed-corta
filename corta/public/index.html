<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corta: acortador interno</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main class="contenedor">
    <header class="marca">
      <img src="logo.png" alt="" class="logo">
      <span>Corta</span>
    </header>

    <section class="tarjeta">
      <div class="encabezado">
        <span class="eyebrow">Simple y rápido</span>
        <h1>CORTA</h1>
        <p class="bajada">El acortador de URLs interno</p>
        <p class="sub">Pegá una URL larga y convertila en un enlace fácil de compartir.</p>
      </div>

      <form id="form">
        <label class="sr-only" for="url">URL para acortar</label>
        <input type="url" id="url" placeholder="https://tu-url-larga.com" required>
        <button type="submit">Acortar link</button>
      </form>

      <div id="resultado" class="resultado oculto" aria-live="polite">
        <div>
          <span class="resultado-etiqueta">Tu nuevo enlace</span>
          <a id="link-corto" href="#" target="_blank" rel="noopener"></a>
        </div>
        <button id="copiar" class="boton-secundario" type="button">Copiar</button>
      </div>
    </section>

    <footer class="pie">
      <span>¿Ya tenés un enlace?</span>
      <a href="stats.html">Consultar estadísticas <span aria-hidden="true">→</span></a>
    </footer>
  </main>

  <script>
    const form = document.getElementById('form');
    const resultado = document.getElementById('resultado');
    const linkCorto = document.getElementById('link-corto');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = document.getElementById('url').value;
      const res = await fetch('/api/links', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });
      const data = await res.json();
      const corta = window.location.origin + data.corta;
      linkCorto.textContent = corta;
      linkCorto.href = corta;
      resultado.classList.remove('oculto');
    });

    document.getElementById('copiar').addEventListener('click', () => {
      navigator.clipboard.writeText(linkCorto.textContent);
    });
  </script>
</body>
</html>
